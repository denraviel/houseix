{% extends 'base.html' %}

{% block title %}Delete Staff - HouseIX Ops{% endblock %}

{% block content %}
<h2>Delete Staff Member</h2>
<div class="card">
    <div class="card-body">
        <p>Are you sure you want to delete staff member: <strong>{{ staff.full_name }}</strong> ({{ staff.email }})?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'staff_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
