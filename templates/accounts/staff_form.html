{% extends 'base.html' %} {% load crispy_forms_tags %} {% block title %}{% if
staff %}Edit{% else %}Add{% endif %} Staff - HouseIX Ops{% endblock %} {% block
content %}
<h2>{% if staff %}Edit Staff{% else %}Add New Staff{% endif %}</h2>
<div class="card">
  <div class="card-body">
    <form method="post">
      {% csrf_token %} {{ form|crispy }}
      <button type="submit" class="btn btn-primary">
        {% if staff %}Update{% else %}Create{% endif %}
      </button>
      <a href="{% url 'staff_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
