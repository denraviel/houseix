{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}{% if object %}Edit{% else %}Record{% endif %} Sale - House IX Ops{% endblock %}
{% block content %}
<h2>{% if object %}Edit{% else %}Record{% endif %} Sale</h2>
<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary">{% if object %}Update{% else %}Record{% endif %}</button>
            <a href="{% if request.user.role in 'owneradmin' %}{% url 'sales_list' %}{% else %}{% url 'employee_dashboard' %}{% endif %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
