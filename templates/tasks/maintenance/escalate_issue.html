{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Escalate Maintenance Issue - HouseIX Ops{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h2 class="mb-1">Escalate Maintenance Issue</h2>
    <div class="text-muted">{{ issue.issue_number }} - {{ issue.title }}</div>
  </div>
  <a href="{% url 'maintenance_issue_detail' issue.pk %}" class="btn btn-outline-secondary">Back to Issue</a>
</div>

<div class="card">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <div class="d-flex gap-2 mt-3">
        <button type="submit" class="btn btn-danger">Escalate Issue</button>
        <a href="{% url 'maintenance_issue_detail' issue.pk %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
