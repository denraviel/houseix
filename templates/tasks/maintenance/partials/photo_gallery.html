{% if photos %}
<div class="row g-2">
    {% for photo in photos %}
    <div class="col-6 col-md-4 col-lg-3">
        <div class="card h-100">
            <a href="{{ photo.photo.url }}" target="_blank" rel="noopener">
                <img src="{{ photo.photo.url }}" class="card-img-top img-fluid" alt="{{ photo.caption|default:'maintenance photo' }}" style="height: 140px; object-fit: cover;">
            </a>
            <div class="card-body p-2">
                <div class="small fw-semibold">{{ photo.caption|default:"Photo" }}</div>
                <div class="text-muted small">{{ photo.uploaded_by.full_name|default:"-" }} · {{ photo.uploaded_at|date:"M d" }}</div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% else %}
<div class="text-center text-muted py-4">No photos uploaded yet for this record.</div>
{% endif %}
