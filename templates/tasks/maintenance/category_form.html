{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Maintenance Category - HouseIX Ops{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h2 class="mb-1">Maintenance Category</h2>
    <div class="text-muted">Create a reusable maintenance category for future issue reporting.</div>
  </div>
  <a href="{% url 'maintenance_category_list' %}" class="btn btn-outline-secondary">Back</a>
</div>

<div class="card">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <div class="d-flex gap-2 mt-3">
        <button type="submit" class="btn btn-primary">Save Category</button>
        <a href="{% url 'maintenance_category_list' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
