{% extends 'base.html' %}
{% block title %}Delete Expense - HouseIX Ops{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card border-danger">
      <div class="card-header bg-danger text-white">Delete Expense</div>
      <div class="card-body">
        <p>Are you sure you want to delete expense <strong>{{ expense.expense_number }}</strong>?</p>
        <p class="text-muted mb-4">Rejected and draft expenses remain fully auditable until deletion.</p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Delete Expense</button>
            <a href="{% url 'expense_detail' expense.pk %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
