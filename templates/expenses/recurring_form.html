{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Recurring Expense - HouseIX Ops{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="mb-1">Recurring Expense Schedule</h2>
        <div class="text-muted">Configure subscriptions and repeating operating costs.</div>
      </div>
      <a href="{% url 'recurring_expense_list' %}" class="btn btn-outline-secondary">Back</a>
    </div>
    <div class="card">
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          {{ form|crispy }}
          <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary">Save Schedule</button>
            <a href="{% url 'recurring_expense_list' %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
