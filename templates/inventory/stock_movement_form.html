{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Take Inventory - HouseIX Ops{% endblock %}

{% block content %}
<h2>Take Inventory</h2>
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Record</button>
    <a href="{% url 'inventory_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
